name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CONTAINER_NAME: vitara-be
  APP_PORT: 3000

jobs:
  # ── Build Docker image & push to GitHub Container Registry ──────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      repo_lc: ${{ steps.repo-lc.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase repo name
        id: repo-lc
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-lc.outputs.repo }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security checks (code + container image) before deploy ─────────────────
  security:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Scan repository filesystem (Trivy)
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,misconfig,secret
          exit-code: 1

      - name: Show Trivy FS findings in logs
        run: |
          echo "=== Trivy FS findings ==="
          cat trivy-fs.txt

      - name: Gate FS scan on HIGH/CRITICAL
        run: |
          if [ "${{ steps.trivy_fs.outcome }}" = "failure" ]; then
            echo "Trivy FS gate failed: HIGH/CRITICAL findings detected."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan built image from GHCR (Trivy)
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ needs.build.outputs.repo_lc }}:latest
          format: table
          output: trivy-image.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,misconfig,secret
          exit-code: 1

      - name: Show Trivy Image findings in logs
        run: |
          echo "=== Trivy image findings ==="
          cat trivy-image.txt

      - name: Gate image scan on HIGH/CRITICAL
        run: |
          if [ "${{ steps.trivy_image.outcome }}" = "failure" ]; then
            echo "Trivy image gate failed: HIGH/CRITICAL findings detected."
            exit 1
          fi

      - name: Upload Trivy text reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-fs.txt
            trivy-image.txt

  # ── Pull pre-built image on EC2 & restart container ─────────────────────────
  deploy:
    needs: [build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Pull image & restart container on EC2
        env:
          GITHUB_TOKEN_VAL: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_VAL: ${{ github.actor }}
          REPO: ${{ needs.build.outputs.repo_lc }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
          APP_PORT: ${{ env.APP_PORT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_FOOD_BUCKET: ${{ secrets.SUPABASE_FOOD_BUCKET }}
          AI_SERVICE_BASE_URL: ${{ secrets.AI_SERVICE_BASE_URL }}
          AI_REQUEST_TIMEOUT_MS: ${{ secrets.AI_REQUEST_TIMEOUT_MS }}
          GOOGLE_OAUTH_REDIRECT_URL: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URL }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            GITHUB_TOKEN_VAL="$GITHUB_TOKEN_VAL" \
            GITHUB_ACTOR_VAL="$GITHUB_ACTOR_VAL" \
            REPO="$REPO" \
            APP_PORT="$APP_PORT" \
            CONTAINER_NAME="$CONTAINER_NAME" \
            FRONTEND_URL="$FRONTEND_URL" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            SUPABASE_FOOD_BUCKET="$SUPABASE_FOOD_BUCKET" \
            AI_SERVICE_BASE_URL="$AI_SERVICE_BASE_URL" \
            AI_REQUEST_TIMEOUT_MS="$AI_REQUEST_TIMEOUT_MS" \
            GOOGLE_OAUTH_REDIRECT_URL="$GOOGLE_OAUTH_REDIRECT_URL" \
            DATA_ENCRYPTION_KEY="$DATA_ENCRYPTION_KEY" \
            bash -s << 'SCRIPT'
          set -e

          echo "▶ Logging in to GHCR..."
          echo "$GITHUB_TOKEN_VAL" | docker login ghcr.io -u "$GITHUB_ACTOR_VAL" --password-stdin

          echo "▶ Pulling latest image..."
          docker pull "ghcr.io/$REPO:latest"

          echo "▶ Stopping old container..."
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          echo "▶ Starting new container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/bun/.cache:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 256 \
            --env NODE_ENV=production \
            --env FRONTEND_URL="$FRONTEND_URL" \
            --env PORT="$APP_PORT" \
            --env SUPABASE_URL="$SUPABASE_URL" \
            --env SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            --env SUPABASE_FOOD_BUCKET="$SUPABASE_FOOD_BUCKET" \
            --env AI_SERVICE_BASE_URL="$AI_SERVICE_BASE_URL" \
            --env AI_REQUEST_TIMEOUT_MS="$AI_REQUEST_TIMEOUT_MS" \
            --env GOOGLE_OAUTH_REDIRECT_URL="$GOOGLE_OAUTH_REDIRECT_URL" \
            --env DATA_ENCRYPTION_KEY="$DATA_ENCRYPTION_KEY" \
            -p "$APP_PORT:$APP_PORT" \
            "ghcr.io/$REPO:latest"

          echo "▶ Cleaning up old images..."
          docker image prune -f

          echo "✅ Deployment successful!"
          SCRIPT
