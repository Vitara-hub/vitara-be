name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto approve safe updates
        if: >
          (steps.metadata.outputs.package-ecosystem == 'npm' &&
            (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
             steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
          (steps.metadata.outputs.package-ecosystem == 'github-actions')
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge safe updates after required checks pass
        if: >
          (steps.metadata.outputs.package-ecosystem == 'npm' &&
            (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
             steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
          (steps.metadata.outputs.package-ecosystem == 'github-actions')
        run: |
          gh pr checks "$PR_URL" --watch --required
          gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip reason
        if: >
          !(
            (steps.metadata.outputs.package-ecosystem == 'npm' &&
              (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
               steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
            (steps.metadata.outputs.package-ecosystem == 'github-actions')
          )
        run: |
          echo "Skip auto-merge for update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Package ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
