services:
  postgres:
    image: postgres:16-alpine
    container_name: vitara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitara}
      POSTGRES_DB: ${POSTGRES_DB:-vitara}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vitara_postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitara} -d ${POSTGRES_DB:-vitara}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4.8.1
    container_name: vitara-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  vitara_postgres_data:
